<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BConnect - Nigeria's Trusted P2P Social Commerce Escrow Application powered by GBCONNET.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BConnect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BConnect Escrow • Powered by GBCONNET</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #ffffff 0%, #f1fdf7 100%);
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .logo-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(15, 168, 106, 0.18);
      animation: pulseGlow 2.2s infinite ease-in-out;
    }

    .logo-img {
      width: 88px;
      height: 88px;
      object-fit: contain;
      z-index: 2;
      animation: floatLogo 3s infinite ease-in-out;
      filter: drop-shadow(0 8px 16px rgba(15, 168, 106, 0.2));
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #0f172a;
      margin: 0 0 4px 0;
      text-transform: uppercase;
    }

    .brand-tagline {
      font-size: 13px;
      font-weight: 700;
      color: #0fa86a;
      letter-spacing: 0.8px;
      margin: 0 0 28px 0;
    }

    .loader-bar {
      width: 160px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #0fa86a, #2563eb);
      border-radius: 4px;
      animation: shimmerMove 1.6s infinite ease-in-out;
    }

    .security-note {
      position: absolute;
      bottom: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
    }

    .security-note svg {
      width: 14px;
      height: 14px;
      fill: #0fa86a;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.92);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.85;
      }
      100% {
        transform: scale(0.92);
        opacity: 0.4;
      }
    }

    @keyframes floatLogo {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
      100% {
        transform: translateY(0);
      }
    }

    @keyframes shimmerMove {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Centralized Animated Loading Splash for Web Initialization -->
  <div id="loading-container">
    <div class="logo-wrapper">
      <div class="logo-glow"></div>
      <img src="logo.png" alt="BConnect" class="logo-img" onerror="this.src='favicon.png'" />
    </div>
    <h1 class="brand-title">BCONNECT</h1>
    <div class="brand-tagline">POWERED BY GBCONNET</div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
    <div class="security-note">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
      <span>100% Escrow Protection &bull; Bank Grade Trust</span>
    </div>
  </div>

  <script>
    // Fade out loading container when Flutter finishes initializing
    function hideLoader() {
      var loader = document.getElementById('loading-container');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 500);
      }
    }

    window.addEventListener('flutter-first-frame', hideLoader);
    // Fallback safety timeout
    setTimeout(hideLoader, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
